<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">NEXUS: Last Horizon mission patch</title>
  <desc id="desc">Round mission patch. An N stands on the lunar south pole; its diagonal is a red descent trajectory that comes in from orbit and touches down at the foot of the letter. Earth hangs low over the horizon and the Sun grazes it. The border reads NEXUS, Last Horizon, LifePlants, Space Apps 2026.</desc>
  <defs>
    <clipPath id="field"><circle cx="256" cy="256" r="198"/></clipPath>
    <path id="top-arc" d="M 42 256 A 214 214 0 0 1 470 256"/>
    <path id="bottom-arc" d="M 22 256 A 234 234 0 0 0 490 256"/>
  </defs>

  <!-- Border band, with a bone outer edge and an amber inner stitch line -->
  <circle cx="256" cy="256" r="250" fill="#f5f2ec"/>
  <circle cx="256" cy="256" r="243" fill="#17181a"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#f5f2ec" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle cx="256" cy="256" r="201" fill="none" stroke="#f2b54a" stroke-width="5"/>

  <g font-family="'Barlow Semi Condensed', 'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#f5f2ec" letter-spacing="7">
    <text font-size="27"><textPath href="#top-arc" startOffset="50%" text-anchor="middle">NEXUS · LAST HORIZON</textPath></text>
    <text font-size="20" letter-spacing="5" fill="#f2b54a"><textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">LIFEPLANTS · SPACE APPS 2026</textPath></text>
  </g>
  <!-- Separators at 9 and 3 o'clock -->
  <g fill="#f2b54a">
    <path d="M 31 256 l 6 -6 l 6 6 l -6 6 z"/>
    <path d="M 469 256 l 6 -6 l 6 6 l -6 6 z"/>
  </g>

  <!-- Field: black sky over the lunar south pole -->
  <g clip-path="url(#field)">
    <rect x="40" y="40" width="432" height="432" fill="#07080b"/>
    <g fill="#f5f2ec">
      <circle cx="132" cy="98" r="1.6"/><circle cx="214" cy="84" r="1.1"/><circle cx="356" cy="92" r="1.4"/>
      <circle cx="420" cy="170" r="1.2"/><circle cx="96" cy="196" r="1.3"/><circle cx="384" cy="226" r="1"/>
      <circle cx="150" cy="250" r="1"/><circle cx="440" cy="270" r="1.4"/><circle cx="268" cy="112" r="0.9"/>
    </g>

    <!-- Earth, low over the horizon as seen from the south pole: half lit -->
    <g transform="translate(398 300)">
      <circle r="23" fill="#2e5d86"/>
      <path d="M -14 -12 q 6 -6 13 -3 q 4 5 -2 9 q -6 2 -4 8 q 1 6 -6 6 q -6 -4 -4 -11 q -3 -5 3 -9 z" fill="#8a9a63"/>
      <path d="M 6 4 q 7 -2 9 4 q 0 7 -6 9 q -5 -1 -5 -6 q -2 -4 2 -7 z" fill="#8a9a63"/>
      <path d="M -19 -9 q 10 -5 22 -1 M -12 13 q 9 -3 18 1" fill="none" stroke="#f5f2ec" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
      <path d="M 2 -22.9 A 23 23 0 0 1 2 22.9 A 13 23 0 0 0 2 -22.9 z" fill="#07080b" opacity="0.6"/>
    </g>

    <!-- The Sun grazing the horizon: a polar sunrise -->
    <g transform="translate(92 350)">
      <path d="M -60 0 H 70" stroke="#f5f2ec" stroke-width="1.5" opacity="0.6"/>
      <circle r="13" fill="#f5f2ec" opacity="0.25"/>
      <circle r="7" fill="#fffdf8"/>
    </g>

    <!-- Regolith: far ridge, near ground and the dark crater with ice -->
    <path d="M 40 366 L 96 350 L 150 360 L 214 342 L 262 352 L 318 338 L 372 352 L 430 344 L 472 356 V 472 H 40 Z" fill="#6b6862"/>
    <path d="M 40 404 Q 150 384 256 398 T 472 392 V 472 H 40 Z" fill="#8e8a82"/>
    <ellipse cx="164" cy="430" rx="54" ry="11" fill="#3f3d3a"/>
    <ellipse cx="176" cy="428" rx="10" ry="2.4" fill="#cfe3ef" opacity="0.8"/>
    <ellipse cx="360" cy="446" rx="30" ry="6" fill="#3f3d3a" opacity="0.7"/>
  </g>

  <!-- Orbit: the descent comes in from a dashed parking orbit -->
  <path d="M 112 116 Q 236 46 384 104" fill="none" stroke="#f5f2ec" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.7"/>

  <!-- The N: two stems standing on the surface, the diagonal is the descent trajectory -->
  <g stroke="#0b0b0c" stroke-width="5" stroke-linejoin="round" paint-order="stroke">
    <path d="M 176 150 H 212 V 340 H 176 Z" fill="#f5f2ec"/>
    <path d="M 300 150 H 336 V 340 H 300 Z" fill="#f5f2ec"/>
    <path d="M 112 116 Q 262 142 336 340 L 300 340 Q 236 192 112 116 Z" fill="#c8553d"/>
  </g>
  <!-- Touchdown at the foot of the N -->
  <path d="M 292 346 H 344" stroke="#f2b54a" stroke-width="4" stroke-linecap="round"/>
</svg>
