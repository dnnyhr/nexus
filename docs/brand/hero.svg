      <path d="M 3 -33.9 A 34 34 0 0 1 3 33.9 A 19 34 0 0 0 3 -33.9 z" fill="#07080b" opacity=".6"/>
    </g>
  </g>

  <!-- Orbit and descent -->
  <path d="M 120 120 Q 640 -10 1180 110" fill="none" stroke="#f5f2ec" stroke-width="1.6" stroke-dasharray="2 8" stroke-linecap="round" opacity=".5"/>
  <path class="descent" d="M 300 70 Q 700 40 905 302" fill="none" stroke="#c8553d" stroke-width="5" stroke-linecap="round"/>
  <circle class="craft" r="6" fill="#f5f2ec"/>

  <!-- Sun grazing the horizon -->
