<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-labelledby="t d">
  <title id="t">NEXUS: Last Horizon</title>
  <desc id="d">Animated banner: a descent trajectory draws itself from orbit down to a small base on the lunar south pole, the antenna sends radio pulses to Earth low on the horizon, and the Sun grazes the edge of the Moon.</desc>
  <style>
    .tw { animation: tw 3.6s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: 1; } 50% { opacity: .15; } }
    .descent { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 7s cubic-bezier(.45,0,.2,1) infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 900; opacity: 1; } 45% { stroke-dashoffset: 0; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .craft { offset-path: path("M 300 70 Q 700 40 905 302"); animation: fly 7s cubic-bezier(.45,0,.2,1) infinite; }
    @keyframes fly { 0% { offset-distance: 0%; opacity: 1; } 45% { offset-distance: 100%; opacity: 1; } 50%,100% { offset-distance: 100%; opacity: 0; } }
    .touch { transform-origin: 905px 306px; animation: touch 7s ease-out infinite; }
    @keyframes touch { 0%,44% { opacity: 0; transform: scale(.2); } 47% { opacity: 1; transform: scale(1); } 70%,100% { opacity: 0; transform: scale(2.6); } }
    .wave { fill: none; stroke: #f2b54a; stroke-width: 2.5; stroke-linecap: round; opacity: 0; transform-origin: 1012px 248px; animation: wave 2.4s ease-out infinite; }
    .wave.b { animation-delay: .8s; } .wave.c { animation-delay: 1.6s; }
    @keyframes wave { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: .95; } 100% { opacity: 0; transform: scale(2.2); } }
    .beacon { animation: blink 1.6s steps(1) infinite; }
    @keyframes blink { 0%,60% { opacity: 1; } 61%,100% { opacity: .15; } }
    .sun { transform-origin: 70px 312px; animation: sun 5s ease-in-out infinite; }
    @keyframes sun { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.25); } }
    .earth { animation: drift 12s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .descent { stroke-dashoffset: 0; } .craft, .touch { opacity: 0; } }
  </style>
