    <path d="M 0 312 H 260" stroke="#f5f2ec" stroke-width="1.5" opacity=".5"/>
    <circle class="sun" cx="70" cy="312" r="22" fill="#f5f2ec" opacity=".3"/>
    <circle cx="70" cy="312" r="9" fill="#fffdf8"/>
  </g>

  <!-- Regolith -->
