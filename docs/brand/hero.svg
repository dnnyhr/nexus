      <circle r="34" fill="#2e5d86"/>
      <path d="M -20 -18 q 9 -9 19 -4 q 6 7 -3 13 q -9 3 -6 12 q 1 9 -9 9 q -9 -6 -6 -16 q -4 -7 5 -14 z" fill="#8a9a63"/>
